# Netlify config for kelsynovin.com
# Only the website files are published (not the original photos or planning notes).

[build]
  command = "rm -rf dist && mkdir -p dist && cp -R index.html styles.css script.js assets dist/ && find dist -name .DS_Store -delete"
  publish = "dist"

# Keep the wedding site out of search engines.
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Cache images for a while; always re-check the page, styles and script.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
